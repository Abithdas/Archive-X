[package]
name = "ax-jobs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The job system ported from Python, on top of ax-db, ax-core's resource policy and its governor policy (orchestrator first)"

[dependencies]
ax-db = { path = "../ax-db" }
ax-core = { path = "../ax-core" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
