[package]
name = "ax-config"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Where Archive X keeps its data and how it starts, ported from config.py and main.py: the data folder, queued moves and staged restores, the manifest, legacy migration, the secrets file, the instance lock"

[dependencies]
ax-core = { path = "../ax-core" }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unicode-properties = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"
regex = "1"
