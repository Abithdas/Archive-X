[package]
name = "ax-db"
version = "0.1.0"
edition = "2021"
description = "Access to the Archive X SQLite database: read-only for everything, plus one writer for the tables Rust owns"

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
