[package]
name = "ax-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Small, pure pieces of the backend ported from Python (retry policy, safe paths, SQL batches, transfer filters)"

[dependencies]
regex = "1"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
unicode-normalization = "0.1"
unicode-properties = "0.1"
caseless = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
fancy-regex = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
