[package]
name = "ax-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Archive X front door: serves the web app, forwards every other request to the Python backend"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "fs", "time", "signal", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mime_guess = "2"
flate2 = "1"
httpdate = "1"
percent-encoding = "2"
tracing = "0.1"
ax-core = { path = "../ax-core" }
md5 = "0.7"
sha2 = "0.10"
ax-db = { path = "../ax-db" }
ax-names = { path = "../ax-names" }
ax-faces = { path = "../ax-faces" }
serde_json = { version = "1", features = ["preserve_order"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
tokio-stream = "0.1"
flate2 = "1"
rcgen = "0.13"
webpki-roots = "0.26"
