<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .t{font-weight:700;font-size:14px;fill:#0f172a}
      .s{fill:#334155;font-size:12px}
      .h{font-weight:700;font-size:12px;fill:#64748b;letter-spacing:.06em}
      .b{stroke-width:1.5;rx:8}
      .l{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .d{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="860" fill="#f8fafc"/>
  <text x="24" y="34" class="t" font-size="20">Archive X v29.5.400 — architecture (single process)</text>

  <!-- clients -->
  <text x="24" y="66" class="h">CLIENTS</text>
  <rect x="24" y="74" width="270" height="62" class="b" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="38" y="98" class="t">Browser / phone SPA</text><text x="38" y="118" class="s">vanilla JS (58 files) + 178 CSS, /ws status</text>
  <rect x="320" y="74" width="270" height="62" class="b" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="334" y="98" class="t">VLC / MPC-HC / FFmpeg</text><text x="334" y="118" class="s">signed ?c=&amp;t= links, plain HTTP</text>
  <rect x="616" y="74" width="270" height="62" class="b" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="630" y="98" class="t">Windows launcher</text><text x="630" y="118" class="s">Archive-X.bat → ps1 → run.py → .venv</text>

  <!-- edge -->
  <text x="24" y="170" class="h">EDGE (0.0.0.0)</text>
  <rect x="24" y="178" width="560" height="96" class="b" fill="#fef3c7" stroke="#d97706"/>
  <text x="38" y="200" class="t">HTTPS :8443 — Hypercorn (h2/h1 + HTTP/3) or Uvicorn</text>
  <text x="38" y="220" class="s">middleware: headers → gzip/ETag → Origin guard → rate limit → correlation</text>
  <text x="38" y="240" class="s">cookie session (HttpOnly, SameSite=Strict, 30d sliding) · local root CA + leaf cert · /ca.crt</text>
  <text x="38" y="260" class="s">first-run /api/auth/setup (loopback only)</text>
  <rect x="610" y="178" width="276" height="96" class="b" fill="#fef3c7" stroke="#d97706"/>
  <text x="624" y="200" class="t">Player feed :8444+ (aiohttp)</text>
  <text x="624" y="220" class="s">HTTP, HMAC token (channel:msg:exp)</text>
  <text x="624" y="240" class="s">→ shared playback engine</text>

  <!-- web layer -->
  <text x="24" y="308" class="h">WEB LAYER  telegram_archive/web</text>
  <rect x="24" y="316" width="862" height="64" class="b" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="38" y="338" class="t">build_router() → 13 routes_* modules + ai / experience / frontend / test_bridge</text>
  <text x="38" y="358" class="s">system(login,setup,exit) · telegram · library · media · playback · entities · settings · jobs · automation · metadata_assets · tags_logs</text>
  <text x="38" y="372" class="s">every handler: require_auth(request) → SessionStore</text>

  <!-- core services -->
  <text x="24" y="414" class="h">ORCHESTRATION  (wired once in app.create_app)</text>
  <rect x="24" y="422" width="270" height="92" class="b" fill="#dcfce7" stroke="#16a34a"/>
  <text x="38" y="444" class="t">JobManager + Orchestrator</text>
  <text x="38" y="464" class="s">13 job types, dependencies, leases,</text><text x="38" y="480" class="s">retries; RecoveryCoordinator marks</text><text x="38" y="496" class="s">restarted jobs INTERRUPTED</text>
  <rect x="310" y="422" width="270" height="92" class="b" fill="#dcfce7" stroke="#16a34a"/>
  <text x="324" y="444" class="t">TransferGovernor</text>
  <text x="324" y="464" class="s">single gate: FloodWait, concurrency,</text><text x="324" y="480" class="s">download/upload slots; ResourceManager,</text><text x="324" y="496" class="s">hardware profile, watchdogs + guardian</text>
  <rect x="596" y="422" width="290" height="92" class="b" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="444" class="t">TelegramService (Telethon)</text>
  <text x="610" y="464" class="s">one shared client; code / 2FA / QR login;</text><text x="610" y="480" class="s">session encrypted at rest;</text><text x="610" y="496" class="s">client_policy, range transport</text>

  <!-- engines -->
  <text x="24" y="548" class="h">ENGINES</text>
  <rect x="24" y="556" width="200" height="104" class="b" fill="#fce7f3" stroke="#db2777"/>
  <text x="38" y="578" class="t">playback/</text><text x="38" y="598" class="s">stream_server: 512 KiB</text><text x="38" y="614" class="s">segments, sparse cache,</text><text x="38" y="630" class="s">prefetch, QoS, VLC launch</text>
  <rect x="236" y="556" width="200" height="104" class="b" fill="#fce7f3" stroke="#db2777"/>
  <text x="250" y="578" class="t">engines/</text><text x="250" y="598" class="s">uploader, sender, transfer,</text><text x="250" y="614" class="s">thumbnails, previews,</text><text x="250" y="630" class="s">delivery ledger, faces</text>
  <rect x="448" y="556" width="200" height="104" class="b" fill="#fce7f3" stroke="#db2777"/>
  <text x="462" y="578" class="t">media_manager/</text><text x="462" y="598" class="s">router, mover, archiver,</text><text x="462" y="614" class="s">dedupe, organizer</text><text x="462" y="630" class="s">(6 mm_* files exec()'d)</text>
  <rect x="660" y="556" width="226" height="104" class="b" fill="#fce7f3" stroke="#db2777"/>
  <text x="674" y="578" class="t">metadata/ + operations/</text><text x="674" y="598" class="s">filename+hash matching,</text><text x="674" y="614" class="s">providers, suggestions;</text><text x="674" y="630" class="s">RSS, qBittorrent, automation</text>

  <!-- persistence -->
  <text x="24" y="694" class="h">PERSISTENCE &amp; EXTERNAL</text>
  <rect x="24" y="702" width="270" height="92" class="b" fill="#f1f5f9" stroke="#475569"/>
  <text x="38" y="724" class="t">SQLite (one conn + readers)</text><text x="38" y="744" class="s">≈59 tables, jobs, media, entities,</text><text x="38" y="760" class="s">web_sessions (hashed), settings,</text><text x="38" y="776" class="s">delivery ledger, backups (.axbackup)</text>
  <rect x="310" y="702" width="270" height="92" class="b" fill="#f1f5f9" stroke="#475569"/>
  <text x="324" y="724" class="t">Files on disk</text><text x="324" y="744" class="s">encrypted credentials + Telegram</text><text x="324" y="760" class="s">session, CA/leaf certs (cert/),</text><text x="324" y="776" class="s">thumb / preview / player caches</text>
  <rect x="596" y="702" width="290" height="92" class="b" fill="#fff7ed" stroke="#ea580c"/>
  <text x="610" y="724" class="t">Outside world</text><text x="610" y="744" class="s">Telegram MTProto · ThePornDB / StashDB</text><text x="610" y="760" class="s">artwork URLs · RSS · qBittorrent (local)</text><text x="610" y="776" class="s">llama.cpp (loopback) · GitHub/HF at setup</text>

  <!-- arrows -->
  <path class="l" d="M159 136V178"/>
  <path class="l" d="M455 136V160H748V178"/>
  <path class="l" d="M304 274V316"/>
  <path class="l" d="M748 274V296H700V316"/>
  <path class="l" d="M159 380V422"/>
  <path class="l" d="M445 380V422"/>
  <path class="l" d="M741 380V422"/>
  <path class="l" d="M159 514V556"/>
  <path class="l" d="M336 514V556"/>
  <path class="l" d="M548 514V556"/>
  <path class="l" d="M773 514V556"/>
  <path class="l d" d="M741 514V534H124V556"/>
  <path class="l" d="M159 660V702"/>
  <path class="l" d="M436 660V702"/>
  <path class="l" d="M741 660V702"/>
  <path class="l d" d="M886 468H930V748H886"/>

  <!-- legend / side notes -->
  <rect x="930" y="74" width="246" height="330" class="b" fill="#fff" stroke="#cbd5e1"/>
  <text x="944" y="98" class="t">Design rules</text>
  <text x="944" y="122" class="s">• one Telegram client</text>
  <text x="944" y="140" class="s">• one governor for FloodWait</text>
  <text x="944" y="158" class="s">• one orchestrator for admission</text>
  <text x="944" y="176" class="s">• no silent resume after crash</text>
  <text x="944" y="194" class="s">• one process, many singletons</text>
  <text x="944" y="224" class="t">Trust boundaries</text>
  <text x="944" y="248" class="s">• LAN clients → :8443 (cookie)</text>
  <text x="944" y="266" class="s">• LAN players → :8444 (token)</text>
  <text x="944" y="284" class="s">• loopback-only: first setup,</text>
  <text x="944" y="302" class="s">  live test bridge</text>
  <text x="944" y="320" class="s">• server → internet: Telegram,</text>
  <text x="944" y="338" class="s">  metadata and artwork hosts</text>
  <text x="944" y="368" class="s">Dashed = cross-cutting use</text>
</svg>
