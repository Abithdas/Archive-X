<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive X mockups</title>
<style>
:root{--bg:#eceff4;--surface:#fff;--s2:#e5e9f0;--s3:#d8dee9;--line:rgb(46 52 64/.09);--line2:rgb(46 52 64/.15);--fg:#2e3440;--muted:#4c566a;--faint:#7b8797;--accent:#527ba5;--accent-fg:#fff;--good:#207a4a;--warn:#8a5a00;--bad:#a83333}
[data-theme=dark]{--bg:#232833;--surface:#2b313d;--s2:#353c4a;--s3:#414a5b;--line:rgb(255 255 255/.07);--line2:rgb(255 255 255/.12);--fg:#eceff4;--muted:#9aa4b6;--faint:#717c90;--accent:#5fd3e0;--accent-fg:#062a2e;--good:#2dba6e;--warn:#e8a838;--bad:#e25555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:248px 1fr;height:860px;overflow:hidden}
aside{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.logo{font-weight:800;font-size:19px;padding:6px 10px 18px;display:flex;gap:10px;align-items:center}.logo i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5fd3e0,#e25590)}
.grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.nav{height:42px;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:500}.nav b{width:18px;height:18px;border-radius:5px;background:var(--s3);display:block}
.nav.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg)}.nav.on b{background:var(--accent)}
.main{display:flex;flex-direction:column;min-width:0;position:relative}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--surface)}
.search{flex:1;max-width:420px;height:40px;border-radius:12px;background:var(--bg);border:1px solid var(--line);padding:0 14px;display:flex;align-items:center;color:var(--faint)}
.sp{flex:1}.pill{height:36px;border-radius:999px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--surface)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.page{padding:24px 40px;overflow:hidden;flex:1;min-height:0;position:relative}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}.sub{color:var(--muted);margin:2px 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{height:36px;border-radius:10px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;border:1px solid var(--line2);background:transparent;color:var(--fg)}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:transparent}.btn.d{background:var(--bad);color:#fff;border-color:transparent}.btn.s{height:30px;font-size:12px;padding:0 10px;border-radius:8px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.th{border-radius:10px;background:linear-gradient(135deg,var(--a,#6aa3c8),var(--b,#2c4a6e));aspect-ratio:4/3}
.chip{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 9px;font-size:11px;font-weight:700;background:var(--s2);color:var(--muted)}
.chip.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}.chip.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.chip.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}.chip.a{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.note{position:absolute;left:40px;bottom:16px;right:40px;font-size:12px;color:var(--faint);display:flex;gap:8px}
.grid{display:grid;gap:14px}
.dim{position:absolute;inset:0;background:rgb(0 0 0/.28);z-index:5}
.pop{position:absolute;z-index:10;right:24px;top:56px;width:420px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:0 22px 60px rgb(0 0 0/.35);overflow:hidden}
.pop h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 16px 6px}
.job{padding:10px 16px;display:grid;gap:6px;border-top:1px solid var(--line)}.job .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}.job .m{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:6px;font-size:11px;color:var(--faint)}.steps b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--s2);color:var(--muted);font-size:10px}.steps b.d{background:var(--good);color:#fff}.steps b.n{background:var(--accent);color:var(--accent-fg)}
table{width:100%;border-collapse:collapse}th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 12px;font-weight:800}td{padding:10px 12px;border-top:1px solid var(--line)}
.tagc{display:inline-flex;align-items:center;gap:7px;height:28px;border-radius:999px;padding:0 12px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}.tagc:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:14px;overflow:hidden;aspect-ratio:16/10}.mini>div{background:linear-gradient(135deg,var(--a),var(--b))}
.kpi{display:grid;gap:2px}.kpi b{font-size:30px;font-weight:800;letter-spacing:-.02em}.kpi span{color:var(--muted);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
.hb{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;font-size:13px}.hb .bar{height:10px}
.map{position:absolute;inset:0;background:#cfe0ea;overflow:hidden}[data-theme=dark] .map{background:#2a3744}
.cl{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:var(--s,54px);height:var(--s,54px);border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));border:3px solid #fff;box-shadow:0 6px 18px rgb(0 0 0/.3);color:#fff;font-weight:800}
.cl i{position:absolute;right:-6px;top:-6px;background:var(--accent);color:var(--accent-fg);font-style:normal;font-size:11px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
</style></head><body>
<script>
const NAV=[["Library"],["Photos"],["People"],["Videos"],["Performers"],["Studios"],["Work"],["Operations"],["Transfers"],["System"],["Settings"],["AI Assistance"]];
function shell(active,inner,opt={}){return `<div class="app"><aside><div class="logo"><i></i>Archive X</div>${NAV.map(n=>n.length==1&&["Library","Work","System"].includes(n[0])?`<div class="grp">${n[0]}</div>`:`<div class="nav ${n[0]==active?'on':''}"><b></b>${n[0]}</div>`).join('')}</aside><div class="main"><header><div class="search">Search videos, performers, studios…</div><div class="sp"></div>${opt.jobs||'<span class="pill">Jobs</span>'}<span class="pill">A</span></header>${inner}</div></div>`}
</script>
<div id="root"></div>
<script>
const th=(a,b,x='')=>`<div class="th" style="--a:${a};--b:${b};${x}"></div>`;
const C=[["#f2a65a","#a43d6b"],["#6aa3c8","#2c4a6e"],["#7fd1ae","#2a6e5b"],["#c79bf2","#5a3d8a"],["#f27c7c","#8a2a3d"],["#f2d35a","#8a6a1d"],["#8ab4f2","#3d5a8a"],["#9be0e0","#2a6e78"]];
const S={
tray:()=>shell('Photos',`<div class="page"><div class="eyebrow">Library</div><h1>Photos</h1><p class="sub">Browse and organize images discovered in your Telegram channels.</p><div class="grid" style="grid-template-columns:repeat(6,1fr)">${C.concat(C).slice(0,12).map(c=>th(c[0],c[1],'aspect-ratio:1')).join('')}</div><div class="dim"></div>
<div class="pop"><div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0"><b style="font-size:16px">Jobs</b><span class="faint" style="font-size:12px">2 running · 1 waiting</span></div>
<h3>Running</h3>
<div class="job"><div class="t"><span>Find people</span><span class="muted">62%</span></div><div class="steps"><b class="d">✓</b><b class="d">✓</b><b class="d">✓</b><b class="n">4</b>&nbsp;Match faces to performers</div><div class="bar"><i style="width:62%"></i></div><div class="m">Matching faces with performer pictures · 14 of 22 people</div><div style="display:flex;gap:6px"><span class="btn s">Pause</span><span class="btn s">Stop</span></div></div>
<div class="job"><div class="t"><span>Telegram transfer · Main Archive</span><span class="muted">18 / 40</span></div><div class="bar"><i style="width:45%"></i></div><div class="m">Downloading Scene 07.mp4 · 2.4 MB/s · 6 min left</div><div style="display:flex;gap:6px"><span class="btn s">Pause</span><span class="btn s">Stop</span></div></div>
<h3>Waiting</h3><div class="job"><div class="t"><span>Image scan · Vertical Clips</span><span class="chip">Queued</span></div></div>
<h3>Done recently</h3>
<div class="job"><div class="t"><span class="good">✓ Metadata check finished</span><span class="faint" style="font-weight:500">2 min ago</span></div></div>
<div class="job"><div class="t"><span class="bad">✕ Upload batch failed</span><span class="btn s">Retry</span></div><div class="m">Telegram was disconnected</div></div>
<div style="padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between"><b style="color:var(--accent);font-size:13px">Open Operations →</b><span class="faint" style="font-size:12px">Clear finished</span></div></div>
<div class="note">① A "Jobs" button with a count sits in the header on every page. ② Click it for this tray: what is running, waiting and done, with Pause / Stop / Retry in place.</div></div>`,{jobs:'<span class="pill" style="border-color:var(--accent)"><span class="badge">2</span> Jobs</span>'}),
collections:()=>shell('Photos',`<div class="page"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">Library</div><h1>Collections</h1><p class="sub">Your own albums for videos and photos.</p></div><span class="btn p">+ New collection</span></div>
<div style="display:flex;gap:8px;margin-bottom:14px"><span class="pill" style="background:var(--s3)">All</span><span class="pill">Videos</span><span class="pill">Photos</span><span class="pill">Mixed</span></div>
<div class="grid" style="grid-template-columns:repeat(4,1fr)">
${[["Favourites of 2025",48,"Mixed",0],["Road trip",126,"Photos",1],["To watch later",23,"Videos",2],["Reference faces",64,"Photos",3],["Best scenes",31,"Videos",4]].map((x,i)=>`<div class="card" style="padding:10px"><div class="mini">${[0,1,2,3].map(k=>`<div style="--a:${C[(i+k)%8][0]};--b:${C[(i+k)%8][1]}"></div>`).join('')}</div><div style="padding:10px 4px 2px"><b>${x[0]}</b><div style="display:flex;gap:8px;align-items:center;margin-top:3px"><span class="muted" style="font-size:13px">${x[1]} items</span><span class="chip ${x[2]=='Videos'?'a':x[2]=='Photos'?'g':''}">${x[2]}</span></div></div></div>`).join('')}
<div class="card" style="display:grid;place-items:center;border-style:dashed;color:var(--muted);min-height:180px"><div style="text-align:center"><div style="font-size:30px">+</div>New collection</div></div></div>
<div class="card" style="position:absolute;right:40px;bottom:64px;width:330px;box-shadow:0 22px 60px rgb(0 0 0/.25)"><b>Add 3 selected photos to…</b><div class="grid" style="margin-top:10px;gap:6px">${["Road trip","Reference faces","Favourites of 2025"].map((n,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;${i==0?'background:color-mix(in srgb,var(--accent) 14%,transparent)':''}"><div class="av" style="--a:${C[i+1][0]};--b:${C[i+1][1]};border-radius:8px"></div><span style="flex:1;font-weight:600">${n}</span>${i==0?'<span class="good">✓</span>':''}</div>`).join('')}<div class="faint" style="padding:4px 6px">+ New collection…</div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><span class="btn s">Cancel</span><span class="btn s p">Add</span></div></div>
<div class="note">Open a collection to drag items into order, set the cover, and play a video collection as a queue. Add from the grid with a multi-select bar (shown bottom right).</div></div>`),
duplicates:()=>shell('Photos',`<div class="page"><div class="eyebrow">Library</div><h1>Duplicate photos</h1><p class="sub">Same picture, different copies. The best copy of each is kept by default.</p>
<div style="display:flex;gap:28px;margin-bottom:16px" class="card"><div class="kpi"><b>184</b><span>groups found</span></div><div class="kpi"><b>402</b><span>extra copies</span></div><div class="kpi"><b class="good">1.2 GB</b><span>can be freed</span></div><div class="sp" style="flex:1"></div><span class="btn">Scan again</span></div>
${[[99,"4032 × 3024 · 3.1 MB","1280 × 960 · 210 KB","Main Archive","Vertical Clips"],[97,"3000 × 2000 · 1.8 MB","3000 × 2000 · 1.7 MB (recompressed)","Anime Gallery","Anime Heaven"]].map((g,i)=>`<div class="card" style="margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 150px;gap:14px;align-items:center">
<div style="position:relative">${th(C[i][0],C[i][1],'aspect-ratio:16/8')}<span class="chip g" style="position:absolute;left:8px;top:8px">Keep · best quality</span><div style="margin-top:6px;font-size:13px"><b>${g[1]}</b><div class="muted">${g[3]}</div></div></div>
<div style="position:relative">${th(C[i][0],C[i][1],'opacity:.85;aspect-ratio:16/8')}<span class="chip b" style="position:absolute;left:8px;top:8px">Remove</span><div style="margin-top:6px;font-size:13px"><b>${g[2]}</b><div class="muted">${g[4]}</div></div></div>
<div style="display:grid;gap:8px;justify-items:end"><span class="chip a">${g[0]}% alike</span><span class="btn s p">Keep best, remove others</span><span class="btn s">Keep both</span></div></div>`).join('')}
<div class="card" style="position:absolute;left:40px;right:40px;bottom:56px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 50px rgb(0 0 0/.25)"><b>12 groups ticked</b><span class="muted">Removes 15 photos, frees 48 MB.</span><label class="muted" style="display:flex;gap:6px;align-items:center;margin-left:12px"><span style="width:16px;height:16px;border:2px solid var(--line2);border-radius:4px;display:inline-block"></span>Also delete from Telegram</label><div class="sp" style="flex:1"></div><span class="btn">Clear</span><span class="btn d">Remove 15 photos</span></div>
<div class="note" style="bottom:10px">Matching uses picture content, not names. "Also delete from Telegram" is off by default; removing only takes photos out of the library.</div></div>`),
tags:()=>shell('Videos',`<div class="page"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">Library</div><h1>Tags</h1><p class="sub">Rename, merge and tidy the tags on your videos and photos.</p></div><span class="btn p">+ New tag</span></div>
<div style="display:grid;grid-template-columns:1fr 300px;gap:16px"><div class="card" style="padding:0"><div style="display:flex;gap:10px;padding:12px"><div class="search" style="max-width:260px;height:34px">Find a tag…</div><span class="pill">Sort: Most used</span><div class="sp" style="flex:1"></div><span class="btn s p">Merge 2 tags</span></div>
<table><tr><th></th><th>Tag</th><th>Videos</th><th>Photos</th><th>Last used</th><th></th></tr>
${[["outdoor","#2dba6e",212,540,"Today"],["brunette","#e8a838",148,96,"Today"],["brunettes","#e8a838",12,3,"3 weeks ago"],["interview","#5fa8e0",97,0,"Yesterday"],["studio","#c79bf2",305,18,"Today"],["pov","#e25590",88,4,"2 days ago"],["untagged-old","#9aa4b6",1,0,"2 years ago"]].map((t,i)=>`<tr><td><span style="width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;background:${i==1||i==2?'var(--accent)':'transparent'};border:2px solid ${i==1||i==2?'var(--accent)':'var(--line2)'};color:var(--accent-fg);font-size:11px">${i==1||i==2?'✓':''}</span></td><td><span class="tagc" style="--c:${t[1]}">${t[0]}</span></td><td>${t[2]}</td><td>${t[3]}</td><td class="muted">${t[4]}</td><td style="text-align:right" class="faint">Rename · Delete</td></tr>`).join('')}</table></div>
<div class="grid"><div class="card"><b>Looks like the same tag</b><p class="muted" style="font-size:13px;margin:6px 0 10px">These two are almost identical.</p><div style="display:flex;gap:8px;align-items:center"><span class="tagc" style="--c:#e8a838">brunette</span>+<span class="tagc" style="--c:#e8a838">brunettes</span></div><div style="display:flex;gap:8px;margin-top:12px"><span class="btn s p">Merge into "brunette"</span><span class="btn s">Not the same</span></div></div>
<div class="card"><b>Rarely used</b><p class="muted" style="font-size:13px;margin:6px 0 10px">Used once, over a year ago.</p><span class="tagc" style="--c:#9aa4b6">untagged-old</span><div style="margin-top:12px"><span class="btn s">Delete tag</span></div></div></div></div>
<div class="note" style="bottom:10px">Tick tags to merge them; every item that had either tag gets the kept one. Merging and deleting have Undo.</div></div>`),
stats:()=>shell('Operations',`<div class="page"><div class="eyebrow">Library</div><h1>Statistics</h1><p class="sub">What is in your archive and how it grows.</p>
<div class="grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px">${[["1,842","videos"],["12,310","photos"],["96","performers"],["41","studios"],["438 GB","stored"]].map(k=>`<div class="card kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>
<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px"><div class="card"><b>Growth</b> <span class="muted" style="font-size:13px">items added per month</span>
<svg viewBox="0 0 520 170" style="width:100%;margin-top:8px"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="M0 140 L45 128 L90 132 L135 104 L180 110 L225 80 L270 90 L315 58 L360 66 L405 40 L450 48 L520 22 L520 170 L0 170Z" fill="url(#g)"/><path d="M0 140 L45 128 L90 132 L135 104 L180 110 L225 80 L270 90 L315 58 L360 66 L405 40 L450 48 L520 22" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>${["Jan","Mar","May","Jul","Sep","Nov"].map((m,i)=>`<text x="${i*100+8}" y="165" font-size="11" fill="var(--faint)">${m}</text>`).join('')}</svg></div>
<div class="card"><b>By resolution</b><div class="grid" style="gap:9px;margin-top:12px">${[["2160p 4K",14],["1080p",46],["720p",28],["480p and lower",12]].map(r=>`<div class="hb"><span>${r[0]}</span><div class="bar"><i style="width:${r[1]*2}%"></i></div><span class="muted">${r[1]}%</span></div>`).join('')}</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px"><div class="card"><b>Top channels</b><div class="grid" style="gap:9px;margin-top:12px">${[["Main Archive",540],["Vertical Clips",410],["Misc",260],["Anime Gallery",180]].map(r=>`<div class="hb"><span>${r[0]}</span><div class="bar"><i style="width:${r[1]/6}%"></i></div><span class="muted">${r[1]}</span></div>`).join('')}</div></div>
<div class="card"><b>Most watched performers</b><div class="grid" style="gap:8px;margin-top:12px">${["Ava Stone","Mia Rivera","Zoe Ray","Nova Lane"].map((n,i)=>`<div style="display:flex;gap:10px;align-items:center"><div class="av" style="--a:${C[i][0]};--b:${C[i][1]}"></div><span style="flex:1;font-weight:600">${n}</span><span class="muted">${48-i*9} videos</span></div>`).join('')}</div></div>
<div class="card"><b>Length of videos</b><svg viewBox="0 0 200 110" style="width:100%;margin-top:10px">${[22,60,90,70,44,26,12,6].map((h,i)=>`<rect x="${i*25+3}" y="${100-h}" width="19" height="${h}" rx="4" fill="var(--accent)" opacity="${.45+i*.07}"/>`).join('')}<text x="3" y="108" font-size="9" fill="var(--faint)">short</text><text x="170" y="108" font-size="9" fill="var(--faint)">long</text></svg></div></div></div>`)
};
const k=location.hash.slice(1)||'tray';if(location.search.includes('dark'))document.documentElement.dataset.theme='dark';document.getElementById('root').innerHTML=S[k]();
</script></body></html>
