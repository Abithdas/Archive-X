# One Cargo workspace for all the Rust in the repository (ADR 0006): the libraries and the front door under crates/,
# and the desktop shell under apps/desktop/. One lock file, one build folder (target/).
[workspace.package]
license = "GPL-3.0-or-later"

[workspace]
resolver = "2"
members = [
    "crates/ax-server",
    "crates/ax-db",
    "crates/ax-core",
    "crates/ax-jobs",
    "crates/ax-backup",
    "crates/ax-names",
    "crates/ax-faces",
    "crates/launcher-core",
    "crates/native-player",
    "apps/desktop/src-tauri",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
