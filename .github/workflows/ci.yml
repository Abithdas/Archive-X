name: CI

on:
  push:
    branches: [main, archive-x-desktop-app]
  pull_request:

# Read-only by default: no job here writes to the repository.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: No two files may differ only by letter case (Windows cannot tell them apart)
        working-directory: .
        run: |
          dup=$(git ls-files | awk '{l=tolower($0); sub(/\.tsx?$/,"",l); print l}' | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::Same name apart from case: $dup"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run unused   # code nobody imports (knip)
      - run: npm test
      - run: npm run build

  backend-desktop-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt websockets
      - run: python tools/tests/test_desktop_mode.py
      # The Rust side reads this database and copies this guard: they must not drift apart unnoticed.
      - run: python tools/parity/dump_schema.py --check
      - run: python tools/parity/gen_origin_vectors.py --check
      # The Rust tag taxonomy is tested against what this Python module returns
      - run: python tools/parity/gen_taxonomy_vectors.py --check
      # The Rust job lifecycle writes (crates/ax-db/src/jobs.rs) replay what this database layer did for the recorded operations
      - run: python tools/parity/gen_job_op_vectors.py --check
      - run: python tools/parity/gen_lease_op_vectors.py --check

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt websockets pytest httpx
      # Some tests make real test videos (the local-folder snapshot and upload tests), so ffmpeg has to be on the runner.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Every Python test, in one command (the older script-style checks are run by tools/tests/test_script_checks.py).
      - run: python -m pytest tools/tests -q

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p archive-x-launcher-core -p archive-x-native-player

  front-door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The desktop shell (archive-x-desktop) needs the Linux web-view libraries, so it is built and tested on Windows in desktop.yml.
      - run: cargo fmt --all --check
      - run: cargo test -p ax-server -p ax-db -p ax-names -p ax-faces -p ax-core
      - run: cargo clippy -p ax-server -p ax-db -p ax-names -p ax-faces -p ax-core -p archive-x-launcher-core -p archive-x-native-player --all-targets -- -D warnings

  parity:
    # The Rust front door must answer like the Python backend: the same seeded library behind both, SFW and NSFW, reads and writes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pip install -r requirements.txt websockets
      - run: cargo build --release -p ax-server
      - run: python tools/parity/run_parity.py --self-check --writes
      - run: python tools/parity/run_parity.py --writes

  front-door-windows:
    # The front door ships in the Windows installer: make sure it builds there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p ax-server
      - run: cargo test -p ax-server -p ax-db -p ax-names -p ax-faces -p ax-core

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install ruff vulture
      - run: ruff check
      # Dead code at 80% confidence must stay at zero; tools/vulture_allowlist.py says why each exception exists.
      - run: vulture telegram_archive tools/vulture_allowlist.py --min-confidence 80
