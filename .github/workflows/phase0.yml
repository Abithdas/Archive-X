name: Phase 0 Telegram trial

# Builds the throw-away Telegram test program (tools/phase0/telegram-trial) for Windows so it can be run on a real PC.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release --manifest-path tools/phase0/telegram-trial/Cargo.toml
      - run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item tools/phase0/telegram-trial/target/release/telegram-trial.exe out/
          Copy-Item tools/phase0/telegram-trial/README.md out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telegram-trial-windows
          path: out
