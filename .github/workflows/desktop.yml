name: Desktop app (Windows)

# Builds the standalone installer: frontend -> frozen Python backend -> Tauri bundle (NSIS + MSI).
# A plain run (no release_version) just uploads the installers as a build artifact.
# A run with release_version (or a pushed tag desktop-vX.Y.Z) also publishes a GitHub Release with the signed installer and
# latest.json, which installed apps read to offer the update (docs/updates.md).
# Repository settings:
#   secrets.TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD   update signing key (needed for a release)
#   vars.FFMPEG_URL / vars.FFMPEG_SHA256   optional pinned ffmpeg build (otherwise BtbN's current one, checked against its checksums)
#   secrets.WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD   Authenticode certificate (not set up)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (for example 30.1.0). Empty = only build the installers."
        required: false
        default: ""
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 20 }

      - name: Work out the release version
        id: ver
        shell: bash
        env: { INPUT_VERSION: "${{ github.event.inputs.release_version }}" }
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then V="${GITHUB_REF#refs/tags/desktop-v}"; fi
          # One place records the version, for the backend and the desktop shell (tools/release/write_version.py); a plain build says "dev".
          python3 tools/release/write_version.py "${V:-dev}" "$GITHUB_SHA"
          if [ -n "$V" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "Releasing version $V"
          else
            echo "No release version: building the installers only"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the React frontend
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run build

      - name: Freeze the backend
        run: pwsh packaging/backend/build.ps1

      - name: Test the frozen backend end to end
        run: |
          pip install websockets
          python tools/tests/test_desktop_mode.py "$PWD\packaging\backend\dist\archive-x-backend\archive-x-backend.exe"

      - name: Fetch pinned ffmpeg
        shell: bash
        env: { FFMPEG_URL: "${{ vars.FFMPEG_URL }}", FFMPEG_SHA256: "${{ vars.FFMPEG_SHA256 }}", FFMPEG_FROM_BTBN: "1" }
        run: bash packaging/scripts/fetch-ffmpeg.sh

      - name: Build the Rust front door
        run: cargo build --release -p ax-server

      - name: Stage the front door and the web files for the installer
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/resources/rust apps/desktop/src-tauri/resources/web
          cp target/release/ax-server.exe apps/desktop/src-tauri/resources/rust/ax-server.exe
          cp -r apps/web/dist/. apps/desktop/src-tauri/resources/web/

      - name: Fetch LAV Filters and build the native player engine
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          bash packaging/scripts/fetch-lav.sh
          bash packaging/scripts/fetch-lav.sh --headers
          cmake -S native/axplayer -B build-axplayer -A x64
          cmake --build build-axplayer --config Release
          mkdir -p apps/desktop/src-tauri/resources/axplayer
          cp build-axplayer/Release/axplayer.dll apps/desktop/src-tauri/resources/axplayer/

      # libmpv is the native player's default engine (it plays what the browser cannot, and it can sit under the see-through app window so the page is drawn over the
      # picture); the LAV engine above stays in the installer as the fallback (ARCHIVE_X_NATIVE_ENGINE=lav).
      - name: Fetch libmpv and build its engine
        shell: bash
        run: |
          bash packaging/scripts/fetch-mpv.sh
          cmake -S native/axplayer -B build-axmpv -A x64 -DAX_ENGINE=mpv
          cmake --build build-axmpv --config Release
          cp build-axmpv/Release/axmpv.dll apps/desktop/src-tauri/resources/axplayer/

      - name: Launcher tests against the frozen backend
        env: { ARCHIVE_X_BACKEND_EXE: "${{ github.workspace }}\\packaging\\backend\\dist\\archive-x-backend\\archive-x-backend.exe" }
        run: |
          cargo test -p archive-x-launcher-core
          cargo test -p archive-x-launcher-core --test launcher -- --ignored --nocapture real_frozen_backend
      - name: Launcher test with the Rust front door in front
        env:
          ARCHIVE_X_BACKEND_EXE: "${{ github.workspace }}\\packaging\\backend\\dist\\archive-x-backend\\archive-x-backend.exe"
          ARCHIVE_X_FRONT_DOOR_EXE: "${{ github.workspace }}\\target\\release\\ax-server.exe"
          ARCHIVE_X_DIST: "${{ github.workspace }}\\apps\\web\\dist"
        run: cargo test -p archive-x-launcher-core --test launcher -- --ignored --nocapture real_backend_with_front_door

      - name: Build the installers (NSIS + MSI)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
        run: |
          $tauri = @('--yes', '@tauri-apps/cli@2', 'build', '--bundles', 'nsis,msi')
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            $tauri += @('--config', 'src-tauri/tauri.release.conf.json')   # also make the signed update files
          } else {
            Write-Host 'No signing key: building without update files'
          }
          npx @tauri

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-x-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Publish the release (installer, MSI, latest.json)
        if: steps.ver.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          VERSION: "${{ steps.ver.outputs.version }}"
          SIGNING_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::Set the repository secret TAURI_SIGNING_PRIVATE_KEY: a release needs signed update files"; exit 1; }
          bundle="$GITHUB_WORKSPACE/target/release/bundle"
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          setup="$(ls "$bundle"/nsis/*-setup.exe | head -n 1)"
          [ -f "$setup.sig" ] || { echo "::error::No .sig next to $setup (was the signing key used in the build step?)"; exit 1; }
          name="Archive-X_${VERSION}_x64-setup.exe"   # GitHub turns spaces in asset names into dots, so use a plain name
          cp "$setup" "$out/$name"; cp "$setup.sig" "$out/$name.sig"
          cp "$(ls "$bundle"/msi/*.msi | head -n 1)" "$out/Archive-X_${VERSION}_x64.msi"
          notes="$(git log -5 --pretty='- %s' | head -c 1500)"
          python3 packaging/scripts/make_latest_json.py --version "$VERSION" --repo "$GITHUB_REPOSITORY" --tag "desktop-v$VERSION" \
            --installer "$name" --signature "$out/$name.sig" --notes "$notes" --out "$out/latest.json"
          gh release create "desktop-v$VERSION" "$out/$name" "$out/$name.sig" "$out/Archive-X_${VERSION}_x64.msi" "$out/latest.json" \
            --title "Archive X $VERSION" --notes "$notes" --target "$GITHUB_SHA"
