name: Security scans

# Four scanners the project borrowed from the wider ecosystem, all run here and none shipped with the app (docs/security/TOOLS.md):
#   gitleaks   secrets in the code and its whole history      (MIT)         blocks
#   Trivy      misconfiguration and fixable HIGH/CRITICAL     (Apache-2.0)  reports in the run summary
#   Nuclei     the running backend, with and without login    (MIT)         weekly and on demand, blocks
#   Claude Code Security Review  the diff of a pull request   (MIT)         only when the ANTHROPIC_API_KEY secret exists
# Dependency advisories stay in sca.yml and code analysis stays in CodeQL.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks 8.30.1 (checksum pinned)
        run: |
          set -euo pipefail
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy (filesystem, misconfiguration and fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "0"   # reported, not blocking: sca.yml already blocks on advisories (see docs/security/TOOLS.md)
      - name: Show the result
        if: always()
        run: |
          { echo '## Trivy'; echo '```'; cat trivy.txt 2>/dev/null || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  nuclei:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Nuclei 3.11.1 (checksum pinned)
        run: |
          set -euo pipefail
          f=nuclei_3.11.1_linux_amd64.zip
          curl -fsSL -o "$f" "https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/$f"
          echo "ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6  $f" | sha256sum -c -
          unzip -q "$f" nuclei
          ./nuclei -update-templates -silent || true
      - name: Scan the running backend
        run: python tools/security/dast.py --nuclei ./nuclei --out nuclei.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nuclei
          path: nuclei.jsonl*
          if-no-files-found: ignore

  claude-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_KEY == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 19 Nov 2026
        if: env.HAS_KEY == 'true'
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
