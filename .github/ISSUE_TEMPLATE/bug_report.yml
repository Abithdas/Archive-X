name: Bug report
description: Something in Archive X does not work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste private channel names, phone numbers or keys. Logs can mention file and channel names, so look through them before you attach them.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, Overview (for example 30.11.3)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode when it happened
      options: [SFW, NSFW, Both, Not sure]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Library or Videos, Player (web), Player (native), Movies and shows or Discover, Transfers or Jobs, Settings, Installer or update, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: In the app, Settings, Overview, "Download logs" gives one zip. Drag it here, or a screenshot.
  - type: input
    id: system
    attributes:
      label: Windows version and display scale
      placeholder: Windows 11 23H2, 100%
