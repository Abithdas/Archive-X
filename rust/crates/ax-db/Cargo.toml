[package]
name = "ax-db"
version = "0.1.0"
edition = "2021"
description = "Read-only access to the Archive X SQLite database (Python stays the only writer)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
