# The Rust side of the backend migration (docs/desktop/RUST-MIGRATION-PLAN.md).
# Kept apart from the desktop workspace so the Tauri build is unaffected until this is ready to ship.
[workspace]
resolver = "2"
members = ["crates/ax-server"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
