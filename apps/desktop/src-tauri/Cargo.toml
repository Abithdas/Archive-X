[package]
name = "archive-x-desktop"
version = "0.1.0"
description = "Archive X desktop app (Tauri shell around the frozen Python backend)"
edition = "2021"

[lib]
name = "archive_x_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
archive-x-launcher-core = { path = "../../../crates/launcher-core" }
archive-x-native-player = { path = "../../../crates/native-player" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
